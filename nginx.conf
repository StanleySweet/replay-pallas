server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API caps /replays/upload-zip at 5 MB (ReplayController.ts). nginx
    # defaults to 1m and would reject the upload with 413 before Fastify
    # ever sees it.
    client_max_body_size 5m;

    # Matched before the SPA block because regex locations outrank prefix ones.
    # This is safe only because the two namespaces differ by case: API routes
    # are lowercase (/replays, /users, ...) and the SPA routes are PascalCase
    # (/Replays, /Replays/ReplayDetails/:matchId, /UserDetails/:userId, ...).
    # nginx location matching is case-sensitive, so "/Replays" cannot collide
    # with "/replays". Adding a lowercase SPA route would break that.
    location ~ ^/(users|replays|local-ratings|lobby-users|health|swagger|metrics) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /metrics authenticates with HTTP Basic, so the Authorization header
        # must survive the hop. Passed through by default; explicit for clarity.
        proxy_set_header Authorization $http_authorization;
    }

    # BrowserRouter in src/App.tsx, so unknown paths are client-side routes
    # and must fall back to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames under /assets, safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
